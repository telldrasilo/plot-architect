name: Temporary lockfile migration validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compute exact root dependency lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify official Vite entry and baseline tests
        run: |
          npm run check
          npm run check:v2
          npm run test:local
          npm run build
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
          npm run build:legacy
      - uses: actions/upload-artifact@v4
        with:
          name: sites-vite-root-lock
          path: site/package-lock.json
          retention-days: 7
