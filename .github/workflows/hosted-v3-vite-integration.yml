name: Hosted v3 + Vite integration QA (no deployment)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted-v3-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify immutable hosted-v3 fixtures and approved UI overlay
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ..
            cat <<'HASHES' | sha256sum -c -
          8b5b30f480621df07bd5a236867cd30c11078efe43740d98f9d445906f6a4fd7  qa/hosted-v3/src/worker.mjs
          5eca120cd95303c5cdf6dd232724a2cfddaf9d149d7bcd58c5fc70ed70c0d79d  qa/hosted-v3/src/mcp_server.mjs
          a23c4847c9944bc872f2d7376a2a05be495b846b42b9f297c68e15b44cb641a6  qa/hosted-v3/src/graph_contract.mjs
          57043937e689995ef5f796d9a78ecf52c3ef93d66db99a5041734aba17d70034  qa/hosted-v3/tests/mcp.test.mjs
          HASHES
          )
          cat <<'HASHES' | sha256sum -c -
          0058de01b8b67c92d81cd1e36492b6940d728b7553848005d8e3e7ffdf608d7b  src/editor.js
          e00f37abb1e1b2d83195a52665df93491287293b0c9a75f78a6c20e807fb427c  public/index.html
          67a520c43959d475259c989e29524b7d605ab5f22453e6e2ad13626a256c020c  package-lock.json
          d475cd6bb3e17192b50acefd3c882cdcdeb924ac92820792eb56c3d46bfe620a  sites-vite-compat/vite.config.mjs
          f5138a6c0d759b0d826e650b5fc2813212d156b9649210d8fd2811ab5177a991  src/sites-vite-entry.mjs
          HASHES
      - name: Isolated overlay of actual hosted v3 runtime
        run: |
          cp ../qa/hosted-v3/src/worker.mjs src/worker.mjs
          cp ../qa/hosted-v3/src/mcp_server.mjs src/mcp_server.mjs
          cp ../qa/hosted-v3/src/graph_contract.mjs src/graph_contract.mjs
          cp ../qa/hosted-v3/tests/mcp.test.mjs tests/mcp.test.mjs
      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run unmodified hosted v3 REST/MCP/security tests
        run: |
          npm run check
          node --test tests/backend.test.mjs tests/mcp.test.mjs tests/sites-security.test.mjs
      - name: Build captured hosted runtime through Sites Vite
        run: |
          npm run build
          test -f dist/server/index.js
          test -f dist/server/wrangler.json
          test -f dist/.openai/hosting.json
          test -f dist/.openai/drizzle/meta/_journal.json
          grep -q 'server/discover' dist/server/index.js
          grep -q '2026-07-28' dist/server/index.js
      - name: Initialize isolated local D1 using existing migration
        run: |
          # --local is mandatory: never run this command against hosted D1.
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --local --config wrangler.sites.jsonc
      - name: Exercise Vite preview and hosted MCP discovery (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/hosted-v3-vite.log"
          npm run dev -- --host 0.0.0.0 --port 4173 --strictPort > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/api/health > "$RUNNER_TEMP/health.json"; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 120 "$log"; exit 1; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/projects)
          test "$status" = 401
          curl -fsS --max-time 6 http://127.0.0.1:4173/ > "$RUNNER_TEMP/editor.html"
          grep -qi 'Plot Architect' "$RUNNER_TEMP/editor.html"
          # Match the hostname used by the private Sites preview browser.
          curl -fsS --max-time 6 -H 'Host: terminal.local:4173' \
            http://127.0.0.1:4173/ > "$RUNNER_TEMP/editor-terminal-local.html"
          grep -qi 'Plot Architect' "$RUNNER_TEMP/editor-terminal-local.html"
          # OpenAI sites-vite-plugin 0.2.0 provides mock sign-in ONLY in vite dev.
          # A signed-out local preview is expected to report authenticated:false.
          curl -fsS --max-time 6 http://127.0.0.1:4173/api/health > "$RUNNER_TEMP/health-anon.json"
          node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.authenticated!==false)process.exit(1)" "$RUNNER_TEMP/health-anon.json"
          curl -fsSL --max-time 10 -c "$RUNNER_TEMP/mock-siwc.cookies" -b "$RUNNER_TEMP/mock-siwc.cookies" \
            'http://127.0.0.1:4173/signin-with-chatgpt?return_to=/' > /dev/null
          curl -fsS --max-time 6 -b "$RUNNER_TEMP/mock-siwc.cookies" \
            http://127.0.0.1:4173/api/health > "$RUNNER_TEMP/health-mock-signed-in.json"
          node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.authenticated!==true||x.authMode!=='sites-native')process.exit(1)" "$RUNNER_TEMP/health-mock-signed-in.json"
          echo "PASS: official Vite plugin mock sign-in enabled local auth without application changes."
          echo "NOTE: local_seedy is NOT the owner's real ChatGPT identity."
          # Reproduce the exact virtual preview hostname, not only 127.0.0.1.
          # --resolve pins the destination to this isolated runner; it does not use a remote Site.
          terminal_url='http://terminal.local:4173'
          terminal_args=(--noproxy '*' --resolve 'terminal.local:4173:127.0.0.1' --max-time 8)
          anonymous_status=$(curl "${terminal_args[@]}" -sS -o "$RUNNER_TEMP/terminal-anon.json" -w '%{http_code}' "$terminal_url/api/projects")
          test "$anonymous_status" = 401
          signin_status=$(curl "${terminal_args[@]}" -sS -D "$RUNNER_TEMP/terminal-signin.headers" \
            -o "$RUNNER_TEMP/terminal-signin.body" -w '%{http_code}' \
            -c "$RUNNER_TEMP/terminal-mock.cookies" \
            "$terminal_url/signin-with-chatgpt?return_to=/")
          echo "terminal.local mock sign-in HTTP: $signin_status"
          case "$signin_status" in 200|302|303|307|308) ;; *) echo "Mock sign-in returned unexpected HTTP status"; exit 1;; esac
          # Check the redirect target WITHOUT printing Set-Cookie headers.
          node --input-type=module - "$RUNNER_TEMP/terminal-signin.headers" <<'JS'
          import fs from 'node:fs';
          const h=fs.readFileSync(process.argv[2],'utf8');
          const line=h.split('\n').map(x=>x.trim()).find(x=>x.toLowerCase().startsWith('location:'));
          if(line){
            const target=line.slice(line.indexOf(':')+1).trim();
            const url=new URL(target,'http://terminal.local:4173/');
            if(url.origin!=='http://terminal.local:4173')throw new Error('Mock sign-in redirect escapes preview origin: '+url.origin);
            console.log('terminal.local sign-in redirect stays same-origin:',url.pathname);
          }
          JS
          curl "${terminal_args[@]}" -fsS -b "$RUNNER_TEMP/terminal-mock.cookies" \
            "$terminal_url/api/health" > "$RUNNER_TEMP/terminal-after-login.json"
          node -e "const x=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));if(x.authenticated!==true)process.exit(1)" "$RUNNER_TEMP/terminal-after-login.json"
          authenticated_status=$(curl "${terminal_args[@]}" -sS \
            -b "$RUNNER_TEMP/terminal-mock.cookies" -o "$RUNNER_TEMP/terminal-projects.json" \
            -w '%{http_code}' "$terminal_url/api/projects")
          test "$authenticated_status" = 200
          echo "PASS: terminal.local mock login, same-origin redirect, session cookie and authenticated API."
          echo "NOTE: curl does not establish browser-automation URL policy compatibility."
          # All writes below target ONLY GitHub runner's synthetic, dummy-ID local D1.
          code=$(curl -sS --max-time 6 -o "$RUNNER_TEMP/qa-list.json" -w '%{http_code}' \
            -b "$RUNNER_TEMP/mock-siwc.cookies" http://127.0.0.1:4173/api/projects)
          test "$code" = 200
          node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(!Array.isArray(x.projects)||x.projects.length!==0)process.exit(1)" "$RUNNER_TEMP/qa-list.json"
          code=$(curl -sS --max-time 6 -o "$RUNNER_TEMP/qa-created.json" -w '%{http_code}' \
            -b "$RUNNER_TEMP/mock-siwc.cookies" \
            -H 'content-type: application/json' \
            -d '{"name":"CI synthetic new graph only","graph":{"nodes":[],"edges":[],"fields":[],"lanes":[]}}' \
            http://127.0.0.1:4173/api/projects)
          test "$code" = 201
          project_id=$(node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.revision!==0||!x.id)process.exit(1);console.log(x.id)" "$RUNNER_TEMP/qa-created.json")
          curl -fsS --max-time 6 -b "$RUNNER_TEMP/mock-siwc.cookies" \
            "http://127.0.0.1:4173/api/projects/$project_id" > "$RUNNER_TEMP/qa-readback.json"
          node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.revision!==0||x.graph.nodes.length!==0)process.exit(1)" "$RUNNER_TEMP/qa-readback.json"
          code=$(curl -sS --max-time 6 -o "$RUNNER_TEMP/qa-update.json" -w '%{http_code}' \
            -b "$RUNNER_TEMP/mock-siwc.cookies" -H 'content-type: application/json' \
            -X PUT -d '{"name":"CI synthetic revision","expectedRevision":0,"graph":{"nodes":[],"edges":[],"fields":[],"lanes":[],"editorialNotes":[{"id":"q1","text":"synthetic"}]}}' \
            "http://127.0.0.1:4173/api/projects/$project_id")
          test "$code" = 200
          code=$(curl -sS --max-time 6 -o "$RUNNER_TEMP/qa-stale.json" -w '%{http_code}' \
            -b "$RUNNER_TEMP/mock-siwc.cookies" -H 'content-type: application/json' \
            -X PUT -d '{"name":"stale","expectedRevision":0,"graph":{"nodes":[],"edges":[],"fields":[],"lanes":[]}}' \
            "http://127.0.0.1:4173/api/projects/$project_id")
          test "$code" = 409
          curl -fsS --max-time 6 -b "$RUNNER_TEMP/mock-siwc.cookies" \
            "http://127.0.0.1:4173/api/projects/$project_id" > "$RUNNER_TEMP/qa-final.json"
          node -e "const f=require('node:fs');const x=JSON.parse(f.readFileSync(process.argv[1],'utf8'));if(x.revision!==1||x.graph.editorialNotes?.[0]?.text!=='synthetic')process.exit(1)" "$RUNNER_TEMP/qa-final.json"
          echo "PASS: isolated local D1 synthetic create, read, editorial note persist, 409, reload."
          curl -fsS --max-time 6 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"server/discover"}' \
            http://127.0.0.1:4173/mcp > "$RUNNER_TEMP/discovery.json"
          curl -fsS --max-time 6 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            http://127.0.0.1:4173/mcp > "$RUNNER_TEMP/tools.json"
          node --input-type=module - "$RUNNER_TEMP/discovery.json" "$RUNNER_TEMP/tools.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const t=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          assert.deepEqual(d.result.supportedVersions,['2026-07-28']);
          const names=t.result.tools.map(x=>x.name).sort();
          assert.deepEqual(names,['apply_patch','get_changes','get_context','get_project','list_projects','preview_patch']);
          console.log('PASS: hosted v3 MCP discovery protocol and six tools');
          JS
          echo "PASS: hosted v3 backend + approved UX Vite build and local preview."
          echo "NOT proof of ChatGPT Sites preview, actual native identity, or production D1."
      - name: Preserve compiled CI candidate for inspection (not deployable)
        uses: actions/upload-artifact@v4
        with:
          name: pa-hosted-v3-vite-compiled
          path: site/dist/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
