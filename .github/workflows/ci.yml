name: Local checks (no deployment)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:v2
      - run: npm run test:local
      - run: npm run build
