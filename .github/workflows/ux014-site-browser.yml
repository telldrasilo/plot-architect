name: UX-014 connected editor browser QA (synthetic only)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ux014-site-editor:
    # Playwright 1.56 browser binaries support Ubuntu 24.04; latest is 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise real Chromium login against isolated Node + SQLite
        run: python qa/browser/tests_node/test_node_local_login_browser.py
      - name: Exercise real Graphite HTML with synthetic Site API
        run: python qa/browser/tests_ux014/test_ux014_hosted_site.py
      - name: Exercise standalone note and editorial link on synthetic Site API
        run: python qa/browser/tests_cw/test_cw_note_browser.py
      - name: Inspect same-canvas transient workspace prototype
        run: python qa/browser/tests_cw/test_cw_workspace_preview_browser.py
      - name: Verify persisted workspace reviewed acceptance in synthetic browser
        run: python qa/browser/tests_cw/test_cw_persisted_workspace_accept_browser.py
      - name: Verify cross-boundary editorial arrows after partial acceptance
        run: python qa/browser/tests_cw/test_cw_boundary_editorial_browser.py
      - name: Review and stage prepared alternatives from standalone note
        run: python qa/browser/tests_cw/test_cw_note_stage_browser.py
      - name: Exercise grouped draft acceptance in real synthetic editor
        run: python qa/browser/tests_cw/test_cw_group_acceptance_browser.py
      - name: Verify reviewed draft coordinate saving in synthetic browser
        run: python qa/browser/tests_cw/test_cw_draft_move_browser.py
      - name: Verify guarded draft text editing and single-solution labels
        run: python qa/browser/tests_cw/test_cw_draft_text_browser.py
      - name: Verify reviewed draft branch deletion, cancellation and empty-area cleanup
        run: python qa/browser/tests_cw/test_cw_discard_drafts_browser.py
      - name: Verify click opens settings and drag never does on synthetic canvas
        run: python qa/browser/tests_cw/test_cw_click_vs_drag_inspector_browser.py
      - name: Verify saved workspace frame group drag, resize and keyboard controls
        run: python qa/browser/tests_cw/test_cw_workspace_geometry_browser.py
      - name: Verify final accepted drafts clean empty workspace and old note
        run: python qa/browser/tests_cw/test_cw_last_accept_cleanup_browser.py
      - name: Verify draft drag-out, cancellation and atomic placement acceptance
        run: python qa/browser/tests_cw/test_cw_drop_to_canon_browser.py
      - name: Verify canonical independent SVG sockets and semantic zoom
        run: python qa/browser/tests_cw/test_cw_canonical_sockets_browser.py
      - name: Verify dense connection rails and overview in synthetic Chromium
        run: python qa/browser/tests_cw/test_cw_dense_sockets_browser.py
      - name: Verify directed and individually anchored draft relations
        run: python qa/browser/tests_cw/test_cw_draft_sockets_browser.py
      - name: Verify canonical socket drag-to-connect, cancel and server CAS
        run: python qa/browser/tests_cw/test_cw_drag_create_canonical_browser.py
      - name: Verify canonical edge reconnect without delete-before-select
        run: python qa/browser/tests_cw/test_cw_rewire_canonical_browser.py
      - name: Verify guarded draft drag-to-connect, cancellation and CAS
        run: python qa/browser/tests_cw/test_cw_draft_drag_connect_browser.py
      - name: Verify draft arrow rewire keeps its old endpoint until confirmed
        run: python qa/browser/tests_cw/test_cw_draft_drag_rewire_browser.py
      - name: Verify guarded draft relation type selection and CAS
        run: python qa/browser/tests_cw/test_cw_draft_edge_type_browser.py
      - name: Verify pending note geometry recovery in synthetic Chromium
        run: python qa/browser/tests_cw/test_cw_pending_geometry_browser.py
      - name: Verify ChatGPT manual JSON handoff and isolated staging
        run: python qa/browser/tests_cw/test_cw_chatgpt_handoff_browser.py
