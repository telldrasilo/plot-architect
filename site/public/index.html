function cwParseChatGPTAlternatives(raw){
 if(typeof raw!=='string'||raw.length>150000)throw Error('Ответ превышает допустимый размер');
 let data;try{data=JSON.parse(raw.trim())}catch{throw Error('Нужен чистый JSON без Markdown')}
 const object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
 const allowed=(x,names)=>Object.keys(x).every(k=>names.includes(k));
 if(!object(data)||!allowed(data,['branches'])||!Array.isArray(data.branches)
  ||data.branches.length<1||data.branches.length>32)
  throw Error('Ожидается объект с массивом branches (1–32 ветви)');
 const branches=[];let nodeCount=0,edgeCount=0;
 for(const branch of data.branches){
  if(!object(branch)||!allowed(branch,['title','events','relations'])
   ||typeof branch.title!=='string'||!branch.title.trim()||branch.title.length>160
   ||!Array.isArray(branch.events)||!branch.events.length
   ||!Array.isArray(branch.relations))
   throw Error('Неверный формат сюжетной ветви');
  if(branch.events.length>128)throw Error('Слишком много событий в одной ветви');
  const keys=new Set();
  for(const event of branch.events){
   if(!object(event)||!allowed(event,['key','title','description'])
    ||typeof event.key!=='string'||!/^[A-Za-z0-9_-]{1,40}$/.test(event.key)
    ||keys.has(event.key)||typeof event.title!=='string'||!event.title.trim()
    ||event.title.length>300||typeof(event.description??'')!=='string'
    ||(event.description??'').length>20000)
    throw Error('Событие: требуется уникальный key, title и необязательное description');
   keys.add(event.key);nodeCount++;
  }
  const relations=new Set();
  for(const edge of branch.relations){
   if(!object(edge)||!allowed(edge,['from','to','type'])||
    !keys.has(edge.from)||!keys.has(edge.to)||edge.from===edge.to||
    !['precedes','causes','enables','hinders'].includes(edge.type))
    throw Error('Стрелка должна соединять два события одной ветви');
   const pair=edge.from+'|'+edge.to+'|'+edge.type;
   if(relations.has(pair))throw Error('Повторяющаяся связь между событиями');
   relations.add(pair);edgeCount++;
  }
  branches.push({title:branch.title,events:branch.events,relations:branch.relations});
 }
 if(nodeCount>256||edgeCount>512)throw Error('Слишком большой набор предложений');
 return branches;
}

  ||cwHandoffRevision!==remote.revision||cwHandoffNoteText!==n.text)
  throw Error('Запрос ChatGPT устарел. Подготовьте новый запрос');

 const maxSize=Math.max(...parsed.map(b=>b.events.length));

    x:x+36+j*254,y:y+48+i*165};

function cwCleanForOperation(){

async function cwWorkflowRequest(id,mode,payload){

  method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)
 });
 let body;try{body=await response.json()}catch{throw Error('Workflow API не вернул JSON')}
 if(!response.ok){
  const err=new Error(body.message||body.error||'Ошибка сохранения');
  err.code=body.error;err.status=response.status;throw err;

}


let cwMoveSaveTimer=null;
let cwMoveSavePromise=null;
let cwMoveRetry=null;
let cwMoveFailure=null;

function cwScheduleDraftSave(){
 if(cwMoveSaveTimer!==null)clearTimeout(cwMoveSaveTimer);
 cwMoveSaveTimer=setTimeout(()=>{
  cwMoveSaveTimer=null;
  void cwSaveDraftMoves().catch(()=>{}); // Error remains visible for explicit retry.
 },100);
}
function cwSaveDraftMoves(){

}
async function cwEnsureDraftsSynced(){
 if(cwMoveSaveTimer!==null){clearTimeout(cwMoveSaveTimer);cwMoveSaveTimer=null}
 if(cwMoveSavePromise)await cwMoveSavePromise;
 if(cwDraftMoveEdits.size)await cwSaveDraftMoves();

}
async function cwRunDraftMoveSave(){
 if(!cwDraftMoveEdits.size)return;
 if(cwAcceptanceBusy&&!cwMoveSavePromise)throw Error('Другая редакторская операция ещё выполняется');
 cwAcceptanceBusy=true;
 $('saved').textContent='● Сохраняется расположение черновиков';
 try{
  while(cwDraftMoveEdits.size){
   if(!remote.connected)throw Error('Локальный проект не подключён');
   if(remote.blocked)throw Error('Несинхронизированная копия проекта. Откройте «Мои истории»');
   // Flush ordinary changes before starting the revision-bound draft command.
   if(remote.dirty||remote.busy)await flushRemote();
   let operation=cwMoveRetry;
   if(!operation){
    const firstId=cwDraftMoveEdits.keys().next().value;
    const first=state.nodes.find(n=>n.id===firstId);
    if(!first?.workspaceId)throw Error('Черновик больше не найден');
    const workspaceId=first.workspaceId;
    const moves=[];
    for(const [nodeId,position] of cwDraftMoveEdits){
     const original=state.nodes.find(n=>n.id===nodeId);
     if(original?.workspaceId!==workspaceId)continue;
     if(position.x===original.x&&position.y===original.y){
      cwDraftMoveEdits.delete(nodeId);continue;
     }
     moves.push({nodeId,x:position.x,y:position.y});
     if(moves.length===128)break;
    }
    if(!moves.length)continue;
    const projectId=activeProjectId,revision=remote.revision;
    const command={kind:'move_drafts',workspaceId,moves};
    const preview=await cwWorkflowRequest(projectId,'preview',{expectedRevision:revision,command});
    if(activeProjectId!==projectId||remote.revision!==revision||remote.dirty||remote.blocked)
     throw Error('Проект изменился во время сохранения');
    const plan=preview.preview;
    if(plan?.workspaceId!==workspaceId||plan.positionChanges?.length!==moves.length
      ||!Array.isArray(plan.affectedDraftEdgeIds)||plan.autoRewiredEdgeIds?.length)
     throw Error('Сервер вернул неожиданный результат проверки координат');
    for(let i=0;i<moves.length;i++){
     const before=state.nodes.find(n=>n.id===moves[i].nodeId),change=plan.positionChanges[i];
     if(change?.nodeId!==moves[i].nodeId||change.before?.x!==before?.x
       ||change.before?.y!==before?.y||change.after?.x!==moves[i].x
       ||change.after?.y!==moves[i].y)throw Error('Проверенные координаты не совпадают');
    }
    operation={projectId,revision,command,plan,operationId:crypto.randomUUID()};
    cwMoveRetry=operation; // Never replace the ID after a possibly successful apply.
   }
   const confirmed=await cwWorkflowRequest(operation.projectId,'apply',{
    expectedRevision:operation.revision,operationId:operation.operationId,
    command:{...operation.command,expectedPreview:operation.plan}
   });
   if(!Number.isSafeInteger(confirmed?.revision))throw Error('Сервер не подтвердил запись');
   const latest=await apiRequest('/api/projects/'+encodeURIComponent(operation.projectId));
   if(activeProjectId!==operation.projectId||remote.dirty||remote.blocked)
    throw Error('Проект изменился до подтверждения сохранения');
   if(!Number.isSafeInteger(latest.revision)||latest.revision<confirmed.revision)
    throw Error('Сервер вернул устаревшую ревизию');
   const next=validateImported(latest.graph);
   for(const move of operation.command.moves){
    const node=next.nodes.find(n=>n.id===move.nodeId);
    if(!node||node.workspaceId!==operation.command.workspaceId
      ||node.x!==move.x||node.y!==move.y)
     throw Error('Сохранённые координаты не подтверждены');
   }
   state=next;remote.revision=latest.revision;remote.dirty=false;
   ensureEditorialState(state); // Same normalization as full render after server readback.
   for(const move of operation.command.moves){
    const pending=cwDraftMoveEdits.get(move.nodeId);
    if(pending?.x===move.x&&pending?.y===move.y)cwDraftMoveEdits.delete(move.nodeId);
   }
   cwMoveRetry=null;cwMoveFailure=null;
   recomputeFieldTags();save(false);if(!cwDraftDragging)renderCreativeWorkspacePreview();
  }
  $('saved').textContent='✓ Сохранено локально · '+remote.revision;
 }catch(err){
  cwMoveFailure={message:err.message,workspaceId:cwMoveRetry?.command.workspaceId||
   state.nodes.find(n=>cwDraftMoveEdits.has(n.id))?.workspaceId};
  $('saved').textContent='! Расположение черновиков не сохранено';
  throw err;
 }finally{
  cwAcceptanceBusy=false;
  if(!cwDraftDragging)renderCreativeWorkspacePreview();
 }
}
// Convert the common world-space port layout to each workspace-local SVG.
// During a drag existing ports are frozen and merely translate with their
// endpoint card; reflow happens only after the completed movement is rendered.
// CW-003/004: visual ports and pointer targets share one screen-space metric policy.
// An external overflow rail is explicit: regular socket centers stay on the
// measured card boundary; densely packed sockets remain individually addressable.
function cwRailGeometry(layout,bounds){
 const result=[];
 for(const warning of layout?.warnings||[]){
  if(warning.code!=='SOCKET_RAIL')continue;
  const rect=bounds[warning.nodeId];
  const ports=layout.byNode.get(warning.nodeId)?.[
   warning.role==='source'?'outgoing':'incoming']||[];
  if(!rect||ports.length<2)continue;
  const y=ports.map(p=>p.y);
  result.push({nodeId:warning.nodeId,role:warning.role,x:ports[0].x,
   boundaryX:ports[0].boundaryX,y1:Math.min(...y),y2:Math.max(...y),
   middleY:rect.y+rect.height/2});
 }
 return result;
}
function cwRailPath(r,originX=0,originY=0){
 return 'M '+(r.x-originX)+' '+(r.y1-originY)+
  ' L '+(r.x-originX)+' '+(r.y2-originY)+
  ' M '+(r.boundaryX-originX)+' '+(r.middleY-originY)+
  ' L '+(r.x-originX)+' '+(r.middleY-originY);
}

function cwPortSeparation(port,layout){
 const group=layout?.byNode?.get(port.nodeId)?.[port.role==='source'?'outgoing':'incoming']||[];
 let nearest=Infinity;
 for(const p of group)if(p.key!==port.key)nearest=Math.min(nearest,Math.abs(p.y-port.y));
 return nearest;
}

 handle.style.minHeight='0';

function cwDrawDraftConnections(svg,area,links,sockets,moves=new Map()){
 if(!sockets)return;
 const paths=new Map([...svg.querySelectorAll('[data-cw-edge]')].map(el=>[el.dataset.cwEdge,el]));
 const hitPaths=new Map([...svg.querySelectorAll('[data-cw-edge-hit]')].map(el=>[el.dataset.cwEdgeHit,el]));
 const directions=new Map([...svg.querySelectorAll('[data-cw-edge-direction]')]
  .map(el=>[el.dataset.cwEdgeDirection,el]));
 const circles=new Map([...svg.querySelectorAll('[data-cw-socket]')].map(el=>[el.dataset.cwSocket,el]));
 for(const edge of links){
  const from=sockets.ports.get(socketKey(edge.id,'source'));
  const to=sockets.ports.get(socketKey(edge.id,'target'));
  if(!from||!to)continue;
  const a=moves.get(edge.from)??{dx:0,dy:0},b=moves.get(edge.to)??{dx:0,dy:0};
  const ax=from.x+a.dx-area.x,ay=from.y+a.dy-area.y;
  const bx=to.x+b.dx-area.x,by=to.y+b.dy-area.y;
  const path=paths.get(edge.id);
  const d='M '+ax+' '+ay+' L '+bx+' '+by;
  if(path){
   path.setAttribute('d',d);
   // Recompute on draft drag as well as initial render, without shortening the path.
   const direction=cwPositionPathDirection(path,directions.get(edge.id));
   if(direction)direction.dataset.cwEdgeDirection=edge.id;
  }
  hitPaths.get(edge.id)?.setAttribute('d',d);
  const left=circles.get(from.key),right=circles.get(to.key);
  if(left){left.setAttribute('cx',ax);left.setAttribute('cy',ay)}
  if(right){right.setAttribute('cx',bx);right.setAttribute('cy',by)}
 }
}
function cwDraftTargetAt(x,y,workspaceId,sourceId,exceptEdgeId=null){
 const target=document.elementFromPoint(x,y)?.closest?.('[data-cw-node]');
 const nodeId=target?.dataset.cwNode;
 if(!nodeId||nodeId===sourceId||!state.nodes.some(n=>n.id===nodeId&&n.workspaceId===workspaceId))
  return null;
 if(state.edges.some(e=>e.workspaceId===workspaceId&&e.from===sourceId
  &&e.to===nodeId&&e.id!==exceptEdgeId))return null;

}
function cwBeginDraftLinkDrag(event,source,area,handle,svg,getSockets,getBounds,existingEdge=null){
 event.preventDefault();event.stopPropagation();
 if(event.button!==0||event.ctrlKey||event.metaKey||!cwWorkflowEnabled()
  ||cwActiveDraftLinkGesture||cwAcceptanceBusy||cwDragDropReview)return;
 if(!cwCleanForOperation()){
  note('Завершите сохранение проекта перед созданием стрелки');return;
 }
 const sourcePort=existingEdge
  ?getSockets()?.ports.get(socketKey(existingEdge.id,'source'))
  :proposeFreeSocket({nodeId:source.id,role:'source',
   layout:getSockets(),bounds:getBounds()});
 if(!sourcePort)return;
 const startX=event.clientX,startY=event.clientY;
 let moved=false,targetId=null;
 const ns='http://www.w3.org/2000/svg';
 const guide=document.createElementNS(ns,'path');guide.classList.add('cw-draft-link-guide');
 guide.setAttribute('aria-hidden','true');svg.append(guide);
 const dot=document.createElementNS(ns,'circle');dot.classList.add('cw-draft-link-candidate');
 dot.setAttribute('r','6');dot.setAttribute('aria-hidden','true');
 dot.setAttribute('hidden','');svg.append(dot);
 const clearTarget=()=>{
  for(const element of document.querySelectorAll('.cw-draft-link-target'))
   element.classList.remove('cw-draft-link-target');
 };
 const cleanup=()=>{
  handle.removeEventListener('pointermove',move);
  handle.removeEventListener('pointerup',end);
  handle.removeEventListener('pointercancel',cancel);
  cwActiveDraftLinkGesture=null;
  guide.remove();dot.remove();clearTarget();
 };
 const move=e=>{
  e.preventDefault();e.stopPropagation();
  if(!moved&&Math.hypot(e.clientX-startX,e.clientY-startY)<5)return;
  moved=true;
  targetId=cwDraftTargetAt(e.clientX,e.clientY,area.id,source.id,existingEdge?.id);
  clearTarget();
  if(targetId)document.querySelector('[data-cw-node="'+targetId+'"]')
   ?.classList.add('cw-draft-link-target');
  const target=targetId?proposeFreeSocket({nodeId:targetId,role:'target',
   layout:getSockets(),bounds:getBounds()}):pointerToWorld(e.clientX,e.clientY);
  const x=sourcePort.x-area.x,y=sourcePort.y-area.y;
  const dx=Math.max(28,Math.abs(target.x-sourcePort.x)*.4);
  guide.setAttribute('d','M'+x+','+y+' C'+(x+dx)+','+y+' '+
   (target.x-area.x-dx)+','+(target.y-area.y)+' '+
   (target.x-area.x)+','+(target.y-area.y));
  guide.classList.toggle('cw-draft-link-valid',!!targetId);
  dot.toggleAttribute('hidden',!targetId);
  if(targetId){dot.setAttribute('cx',target.x-area.x);
   dot.setAttribute('cy',target.y-area.y)}
 };
 const end=e=>{
  e.preventDefault();e.stopPropagation();
  if(moved)targetId=cwDraftTargetAt(e.clientX,e.clientY,area.id,source.id,existingEdge?.id);
  cleanup();
  if(moved&&targetId&&targetId!==existingEdge?.to){
   const command=existingEdge
    ?{kind:'rewire_draft_edge',workspaceId:area.id,
      edgeId:existingEdge.id,to:targetId}
    :{kind:'add_draft_edge',workspaceId:area.id,
      edge:{id:'dedge-'+crypto.randomUUID(),from:source.id,to:targetId,type:'precedes'}};
   void cwCommitDraftEdge(command);
  }
 };
 const cancel=e=>{e?.stopPropagation();cleanup()};
 cwActiveDraftLinkGesture={cancel};
 handle.setPointerCapture(event.pointerId);
 handle.addEventListener('pointermove',move);
 handle.addEventListener('pointerup',end);
 handle.addEventListener('pointercancel',cancel);
}

function cwPositionEdgeToolbar(target){
 if(!cwEdgeToolbar?.isConnected||!target?.path?.isConnected)return;
 const len=target.path.getTotalLength();if(!Number.isFinite(len)||len<=0)return;
 const p=target.path.getPointAtLength(len/2),m=target.path.getScreenCTM();
 if(!m)return;
 const x=m.a*p.x+m.c*p.y+m.e,y=m.b*p.x+m.d*p.y+m.f;
 const w=cwEdgeToolbar.offsetWidth,h=cwEdgeToolbar.offsetHeight,g=12,o=16;
 const candidates=[
  [x-w/2,y-h-o],[x-w/2,y+o],[x-w-o,y-h/2],[x+o,y-h/2]
 ];
 const obstacles=[...document.querySelectorAll('.node,.cw-preview-card')].map(el=>el.getBoundingClientRect());
 const inspect=$('inspector');
 if(inspect&&!inspect.hidden)obstacles.push(inspect.getBoundingClientRect());
 let best=null;
 for(let i=0;i<candidates.length;i++){
  const [xx,yy]=candidates[i],left=Math.max(g,Math.min(window.innerWidth-w-g,xx));
  const top=Math.max(g,Math.min(window.innerHeight-h-g,yy));
  const collision=obstacles.reduce((sum,r)=>sum+
   Math.max(0,Math.min(left+w,r.right)-Math.max(left,r.left))*
   Math.max(0,Math.min(top+h,r.bottom)-Math.max(top,r.top)),0);
  const score=collision*100+Math.abs(left-xx)+Math.abs(top-yy)+i;
  if(!best||score<best.score)best={x:left,y:top,score};
 }
 if(best){cwEdgeToolbar.style.left=best.x+'px';cwEdgeToolbar.style.top=best.y+'px'}
}

  const preview=await cwWorkflowRequest(projectId,'preview',{
   expectedRevision:revision,command});
  const plan=preview.preview;
  if(activeProjectId!==projectId||remote.revision!==revision||remote.dirty||
   remote.blocked||!plan||plan.workspaceId!==command.workspaceId||
   plan.autoRewiredEdgeIds?.length)
   throw Error('Проверка черновой стрелки устарела');
  if(command.kind==='add_draft_edge'&&(
    plan.edge?.id!==command.edge.id||plan.edge?.from!==command.edge.from||
    plan.edge?.to!==command.edge.to||plan.edge?.draftRelation!=='internal'))
   throw Error('Сервер вернул неожиданную стрелку');
  if(command.kind==='rewire_draft_edge'&&(
    plan.edgeId!==command.edgeId||plan.after?.to!==command.to))
   throw Error('Сервер вернул неожиданное переподключение');
  if(command.kind==='set_draft_edge_type'&&(
    !before||before.draftRelation!=='internal'||plan.operation!=='type'||
    plan.edgeId!==command.edgeId||plan.before?.type!==before.type||
    plan.before?.from!==before.from||plan.before?.to!==before.to||
    plan.after?.from!==before.from||plan.after?.to!==before.to||
    plan.after?.id!==before.id||plan.after?.type!==command.newType||
    plan.after?.workspaceId!==command.workspaceId))
   throw Error('Сервер вернул неожиданное изменение отношения');
  sent=true;
  const receipt=await cwWorkflowRequest(projectId,'apply',{
   expectedRevision:revision,operationId:crypto.randomUUID(),
   command:{...command,expectedPreview:plan}});
  const latest=await apiRequest('/api/projects/'+encodeURIComponent(projectId));
  if(latest.revision<receipt.revision)throw Error('Устаревшая серверная ревизия');
  applyReadback(latest);
 }catch(err){
  // Never blindly replay an ambiguous write with a new operation ID.
  if(sent&&!verified&&activeProjectId===projectId){
   try{
    const latest=await apiRequest('/api/projects/'+encodeURIComponent(projectId));
    const edge=latest.graph?.edges?.find(e=>e.id===(command.edge?.id||command.edgeId));
    if(confirmed(edge))applyReadback(latest);
   }catch{}
  }
  if(!verified){
   if(err.code==='REVISION_CONFLICT')remote.blocked=true;
   note('Стрелка не сохранена: '+err.message);
  }
 }finally{cwAcceptanceBusy=false}
}

async function cwSaveDraftText(){

 if(!title||title.length>300||description.length>20000){

 }

 if(!old){note('Черновик изменился. Обновите проект');return}
 if(!edit.pending&&title===old.title&&description===(old.description||'')){
  cwDraftTextEdit=null;renderCreativeWorkspacePreview();return;
 }
 try{await cwEnsureDraftsSynced()}catch(err){note('Сначала сохраните расположение: '+err.message);return}
 if(!cwCleanForOperation()){note('Проект ещё синхронизируется');return}
 const projectId=activeProjectId,revision=edit.pending?.revision??remote.revision;
 const command=edit.pending?.command??{
  kind:'edit_draft_text',workspaceId:edit.workspaceId,nodeId:edit.nodeId,title,description};
 let sent=false,verified=false;
 cwAcceptanceBusy=true;
 const confirm=latest=>{
  const node=latest.graph?.nodes?.find(n=>n.id===edit.nodeId);
  if(activeProjectId!==projectId||cwDraftTextEdit!==edit||remote.blocked||
     remote.dirty||!Number.isSafeInteger(latest.revision)||
     latest.revision<=revision||node?.workspaceId!==edit.workspaceId||
     node.title!==command.title||node.description!==command.description)
   throw Error('Текст не подтверждён повторным чтением');
  state=validateImported(latest.graph);remote.revision=latest.revision;
  remote.dirty=false;verified=true;cwDraftTextEdit=null;
  try{localStorage.removeItem(PENDING_PREFIX+projectId)}catch{}
  recomputeFieldTags();save(false);render();note('Черновик сохранён');
 };
 try{
  if(!edit.pending){
   const reviewed=await cwWorkflowRequest(projectId,'preview',{expectedRevision:revision,command});
   const plan=reviewed.preview;
   if(activeProjectId!==projectId||cwDraftTextEdit!==edit||
      remote.revision!==revision||remote.dirty||remote.blocked||
      !plan||plan.workspaceId!==edit.workspaceId||plan.nodeId!==edit.nodeId||
      plan.before?.title!==old.title||
      plan.before?.description!==(old.description||'')||
      plan.after?.title!==title||plan.after?.description!==description||
      plan.autoRewiredEdgeIds?.length)
    throw Error('Предпросмотр изменения устарел');
   edit.pending={revision,command,plan,operationId:crypto.randomUUID()};
  }
  const pending=edit.pending;
  sent=true;
  const receipt=await cwWorkflowRequest(projectId,'apply',{
   expectedRevision:pending.revision,operationId:pending.operationId,
   command:{...pending.command,expectedPreview:pending.plan}});
  if(!Number.isSafeInteger(receipt?.revision))throw Error('Нет подтверждения записи');
  const latest=await apiRequest('/api/projects/'+encodeURIComponent(projectId));
  if(latest.revision<receipt.revision)throw Error('Сервер вернул устаревшую ревизию');
  confirm(latest);
 }catch(err){
  // Ambiguous network result: recover by readback; retries reuse operationId.
  if(sent&&!verified&&activeProjectId===projectId){
   try{confirm(await apiRequest('/api/projects/'+encodeURIComponent(projectId)))}catch{}
  }
  if(!verified){
   if(err.code==='REVISION_CONFLICT'||err.code==='PREVIEW_STALE')remote.blocked=true;
   note('Черновик не сохранён: '+err.message);
  }
 }finally{
  cwAcceptanceBusy=false;

}
function cwBeginDraftDrag(event,card,node,area,svg,links,byId,getSockets){
 event.stopPropagation();
 if(event.button!==0)return;
 if(!cwWorkflowEnabled())return;
 if(event.ctrlKey||event.metaKey){event.preventDefault();return}
 if(!remote.connected){
  note('Проект не подключён. Проверьте локальный сервер и вход в Graphite');return;
 }
 if(remote.blocked){
  note('Запись заблокирована: есть несинхронизированная копия. Откройте «Мои истории»');return;
 }
 if(cwDragDropReview||cwAcceptanceBusy&&!cwMoveSavePromise)return;
 event.preventDefault();
 if(cwSelectedWorkspaceId!==area.id||!cwSelectedDraftIds.has(node.id)){
  cwSelectedDraftIds.clear();cwSelectedDraftIds.add(node.id);
  cwSelectedWorkspaceId=area.id;
 }
 cwAcceptanceReview=null;cwStageReview=null;
 const members=[...cwSelectedDraftIds].map(id=>byId.get(id)).filter(Boolean);
 const initial=members.map(n=>({id:n.id,x:n.x,y:n.y}));
 const cardMap=new Map([...card.parentElement.querySelectorAll('[data-cw-node]')]
  .map(el=>[el.dataset.cwNode,el]));
 const startX=event.clientX,startY=event.clientY;
 let dx=0,dy=0,moved=false;
 let hover='inside';
 card.setPointerCapture(event.pointerId);
 cwDraftDragging++;
 const draw=()=>{
  const movedNodes=new Map(initial.map(n=>[n.id,{x:n.x+dx,y:n.y+dy}]));
  for(const n of initial){
   const el=cardMap.get(n.id);
   if(el){el.style.left=(n.x+dx-area.x)+'px';el.style.top=(n.y+dy-area.y)+'px'}
  }
  const movements=new Map(initial.map(n=>[n.id,{dx,dy}]));
  cwDrawDraftConnections(svg,area,links,getSockets(),movements);
 };
 const move=e=>{
  e.stopPropagation();
  const nextX=Math.round((e.clientX-startX)/pan.scale);
  const nextY=Math.round((e.clientY-startY)/pan.scale);
  if(!moved&&Math.abs(nextX)+Math.abs(nextY)<4)return;
  moved=true;
  dx=Math.max(-1000000-Math.min(...initial.map(n=>n.x)),
   Math.min(1000000-Math.max(...initial.map(n=>n.x)),nextX));
  dy=Math.max(-1000000-Math.min(...initial.map(n=>n.y)),
   Math.min(1000000-Math.max(...initial.map(n=>n.y)),nextY));
  draw();
  const lead=initial.find(n=>n.id===node.id);
  hover=cwDropClassification(area.id,lead.x+dx+104,lead.y+dy+52);
  card.classList.toggle('cw-drop-target',hover==='plot');
  card.classList.toggle('cw-drop-invalid',hover==='invalid');
  card.parentElement.classList.toggle('cw-drop-hover',hover==='plot');
 };
 const cleanup=()=>{
  cwActiveDraftDragCancel=null;
  cwDraftDragging=Math.max(0,cwDraftDragging-1);
  card.removeEventListener('pointermove',move);
  card.removeEventListener('pointerup',end);
  card.removeEventListener('pointercancel',cancel);
 };
 const end=e=>{
  e.stopPropagation();cleanup();
  if(moved&&hover==='invalid'){
   renderCreativeWorkspacePreview();
   note('Сюжетную ноду нельзя перенести в другую рабочую область');
   return;
  }
  if(moved&&hover==='plot'){
   const placements=initial.map(n=>({nodeId:n.id,x:n.x+dx,y:n.y+dy}));
   cwDragDropReview={projectId:activeProjectId,workspaceId:area.id,
    nodeIds:initial.map(n=>n.id),placements,phase:'checking'};
   cwAcceptanceReview=null;
   renderCreativeWorkspacePreview();
   void cwPrepareAccept(initial.map(n=>n.id),area.id,placements);
   return;
  }
  if(moved){
   for(const n of initial){
    const original=state.nodes.find(x=>x.id===n.id),x=n.x+dx,y=n.y+dy;
    if(original?.x===x&&original?.y===y)cwDraftMoveEdits.delete(n.id);
    else cwDraftMoveEdits.set(n.id,{x,y});
   }
  }
  renderCreativeWorkspacePreview();
  if(moved&&cwDraftMoveEdits.size)cwScheduleDraftSave();
 };
 const cancel=e=>{
  e?.stopPropagation();cleanup();renderCreativeWorkspacePreview();
 };
 cwActiveDraftDragCancel=cancel;
 card.addEventListener('pointermove',move);
 card.addEventListener('pointerup',end);
 card.addEventListener('pointercancel',cancel);
}

async function cwPrepareNoteStage(noteId){

  workspace:structuredClone(prepared.workspace),branches:structuredClone(prepared.branches)};

async function cwConfirmNoteStage(){

  if(activeProjectId!==r.projectId||remote.dirty||remote.blocked)
   throw Error('Локальная копия изменилась во время сохранения');

   throw Error('Сервер вернул устаревшую ревизию');
  const next=validateImported(latest.graph);

  // Do not rotate operationId following an ambiguous reply or lost GET.

  }else note('Сохранение не подтверждено: '+err.message);
 }finally{cwAcceptanceBusy=false;renderInspector()}
}

async function cwPrepareAccept(nodeIds,workspaceId,placements){
 const dropRef=placements===undefined?null:cwDragDropReview;
 if(placements!==undefined&&!dropRef)return;
 if(placements===undefined)cwDragDropReview=null;
 try{
  await cwEnsureDraftsSynced();
  if(remote.connected&&(remote.dirty||remote.busy))await flushRemote();
 }catch(err){if(dropRef&&cwDragDropReview===dropRef)cwCancelDropReview();note('Принятие пока недоступно: '+err.message);return}
 if(dropRef&&cwDragDropReview!==dropRef)return;
 if(!cwCleanForOperation()){
  if(dropRef)cwCancelDropReview();
  note(remote.blocked?'Конфликт сохранения проекта: проверьте локальную копию':'Проект изменился. Повторите действие');return
 }
 if(!Array.isArray(nodeIds)||!nodeIds.length||new Set(nodeIds).size!==nodeIds.length
   ||nodeIds.some(id=>!state.nodes.some(n=>n.id===id&&n.workspaceId===workspaceId))){
  if(dropRef)cwCancelDropReview();
  note('Выберите черновики одной рабочей области');return
 }
 const id=activeProjectId,revision=remote.revision,selection=[...nodeIds];
 cwAcceptanceBusy=true;
 try{
  const command={kind:'accept_draft',workspaceId,nodeIds:selection,
   ...(placements===undefined?{}:{placements})};
  const reviewed=await cwWorkflowRequest(id,'preview',{expectedRevision:revision,command});
  if(dropRef&&cwDragDropReview!==dropRef)return;
  if(activeProjectId!==id||remote.revision!==revision||remote.dirty||remote.blocked)
   throw Error('Проект изменился во время проверки. Повторите действие');
  const plan=reviewed.preview;
  if(!plan||JSON.stringify(plan.acceptNodeIds)!==JSON.stringify(selection)
    ||plan.workspaceId!==workspaceId||!Array.isArray(plan.promoteEdgeIds)
    ||!Array.isArray(plan.reviewEdgeIds)||plan.autoRewiredEdgeIds?.length
    ||(placements!==undefined&&(!Array.isArray(plan.positionChanges)
      ||plan.positionChanges.length!==selection.length
      ||plan.positionChanges.some((p,i)=>p.nodeId!==selection[i]
        ||p.after?.x!==placements.find(v=>v.nodeId===p.nodeId)?.x
        ||p.after?.y!==placements.find(v=>v.nodeId===p.nodeId)?.y))))
   throw Error('Проверка вернула неожиданный состав изменений');
  cwAcceptanceReview={projectId:id,revision,nodeIds:selection,workspaceId,plan,
   ...(placements===undefined?{}:{placements}),operationId:crypto.randomUUID()};
  if(dropRef)dropRef.phase='ready';
 }catch(err){
  if(!dropRef||cwDragDropReview===dropRef){
   cwAcceptanceReview=null;
   if(dropRef)cwDragDropReview=null;
   note('Не удалось проверить принятие: '+err.message);
  }
 }
 finally{cwAcceptanceBusy=false;renderCreativeWorkspacePreview()}
}
async function cwConfirmAccept(){
 const review=cwAcceptanceReview;
 if(!review||!cwCleanForOperation())return note('Проект изменился. Повторите проверку');
 if(review.projectId!==activeProjectId||review.revision!==remote.revision)return note('Ревизия проекта изменилась');
 cwAcceptanceBusy=true;
 try{
  const command={kind:'accept_draft',workspaceId:review.workspaceId,nodeIds:[...review.nodeIds],
   ...(review.placements===undefined?{}:{placements:review.placements}),expectedPreview:review.plan};
  const committed=await cwWorkflowRequest(review.projectId,'apply',{
   expectedRevision:review.revision,operationId:review.operationId,command
  });
  if(!committed||!Number.isSafeInteger(committed.revision))
   throw Error('Сервер не подтвердил ревизию');
  const latest=await apiRequest('/api/projects/'+encodeURIComponent(review.projectId));
  if(activeProjectId!==review.projectId||remote.dirty||remote.blocked)
   throw Error('Локальная версия изменилась — выполните проверку синхронизации');
  if(!Number.isSafeInteger(latest.revision)||latest.revision<committed.revision)
   throw Error('Сервер вернул устаревшее состояние после принятия');
  if(review.nodeIds.some(id=>{
   const node=latest.graph?.nodes?.find(n=>n.id===id);
   const target=review.placements?.find(p=>p.nodeId===id);
   return !node||node.workspaceId!=null||(target&&(node.x!==target.x||node.y!==target.y));
  }))throw Error('Принятие и координаты не подтверждены повторным чтением');
  state=validateImported(latest.graph);
  remote.revision=latest.revision;
  remote.dirty=false;
  selected=null;selectedNodeIds.clear();linkFrom=null;history=[];
  cwClearDraftSelection();
  cwDragDropReview=null;
  recomputeFieldTags();
  save(false);render();
  $('saved').textContent='✓ '+(cwLocalWorkflowEnabled?'Сохранено локально':'Сохранено в Site')+' · '+remote.revision;
  note('Выбранные события приняты в сюжет. Остальные черновики сохранены');
 }catch(err){
  // Keep the same operationId for retry after an ambiguous network failure.
  // Never silently mint a second write after a possibly committed request.
  if(err.code==='REVISION_CONFLICT'||err.code==='PREVIEW_STALE'){
   cwAcceptanceReview=null;cwDragDropReview=null;
   note('Конфликт ревизий. Обновите проект и повторите проверку');
  }else note('Принятие не подтверждено: '+err.message);
 }finally{cwAcceptanceBusy=false;renderCreativeWorkspacePreview()}
}

const cwPreviewId=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(s);
const cwPreviewNumber=n=>typeof n==='number'&&Number.isFinite(n)&&Math.abs(n)<=1000000;
function setCreativeWorkspacePreview(proposal){
 if(proposal===null){creativeWorkspacePreview=null;render();return}
 if(!proposal||!Array.isArray(proposal.workspaces)||!Array.isArray(proposal.nodes)||!Array.isArray(proposal.edges)
    ||proposal.workspaces.length>12||proposal.nodes.length>128||proposal.edges.length>256)throw Error('Некорректный синтетический предпросмотр');
 const scene=structuredClone(proposal),areaIds=new Set(),nodeIds=new Set(),nodeById=new Map();
 for(const a of scene.workspaces){
  if(!cwPreviewId(a.id)||areaIds.has(a.id)||![a.x,a.y,a.width,a.height].every(cwPreviewNumber)
     ||a.width<250||a.height<140)throw Error('Некорректная рабочая область');
  areaIds.add(a.id);
 }
 for(const n of scene.nodes){
  if(!cwPreviewId(n.id)||nodeIds.has(n.id)||!areaIds.has(n.workspaceId)
     ||typeof n.title!=='string'||n.title.length>300
     ||typeof (n.description??'')!=='string'||(n.description??'').length>5000
     ||![n.x,n.y].every(cwPreviewNumber))throw Error('Некорректная черновая карточка');
  nodeIds.add(n.id);nodeById.set(n.id,n);
 }
 const edgeIds=new Set();
 for(const e of scene.edges){
  const from=nodeById.get(e.from),to=nodeById.get(e.to);
  if(!cwPreviewId(e.id)||edgeIds.has(e.id)||!from||!to||from.id===to.id
     ||from.workspaceId!==e.workspaceId||to.workspaceId!==e.workspaceId
     ||e.draftRelation!=='internal')throw Error('Некорректная внутренняя связь черновика');
  edgeIds.add(e.id);
 }
 creativeWorkspacePreview=scene;
 render();
}
function cwPersistedWorkspaceScene(){
 if(state.view!==null||!Array.isArray(state.workspaces)||!state.workspaces.length)return null;
 const owned=state.workspaces.filter(a=>a&&typeof a.id==='string');
 const ownerIds=new Set(owned.map(a=>a.id));
 const nodes=state.nodes.filter(n=>n.workspaceId&&ownerIds.has(n.workspaceId)).map(n=>{
  const position=cwDraftMoveEdits.get(n.id);
  // All canvas previews must work on copies. Never change state.nodes
  // before the reviewed server acceptance has been confirmed.
  return {...n,...(position?{x:position.x,y:position.y}:{})};
 });
 // Frame expands around moved drafts without altering stored workspace bounds.
 const workspaces=owned.map(area=>({...area,...cwDropRectFor(area)}));
 // The draft never changes membership until the atomic acceptance succeeds.
 // Preview coordinates are only for rendering while the user decides.
 if(cwDragDropReview?.projectId===activeProjectId){
  const positions=new Map(cwDragDropReview.placements.map(p=>[p.nodeId,p]));
  for(const n of nodes){
   const p=positions.get(n.id);

// Position the reviewed drop beside the *rendered* card. Cards have
// variable heights and the canvas may be zoomed, so world-space fixed offsets
// can overlap the text. Compare real viewport rectangles after DOM insertion.
function cwPositionDropReview(panel,box,nodeIds){
 const cards=[...box.querySelectorAll('.cw-preview-card')];
 const lead=cards.find(card=>card.dataset.cwNode===nodeIds[0]);
 if(!lead)return;
 const anchor=lead.getBoundingClientRect(),boxRect=box.getBoundingClientRect();
 const panelRect=panel.getBoundingClientRect();
 const scale=box.offsetWidth?boxRect.width/box.offsetWidth:0;
 if(!Number.isFinite(scale)||scale<=0||!panelRect.width||!panelRect.height)return;
 const width=panelRect.width,height=panelRect.height;
 const viewportWidth=document.documentElement.clientWidth;
 const viewportHeight=document.documentElement.clientHeight;
 const margin=12,gap=12;
 const clamp=(value,low,high)=>Math.max(low,Math.min(value,Math.max(low,high)));
 const intersection=(left,top,right,bottom,other)=>{
  const w=Math.max(0,Math.min(right,other.right)-Math.max(left,other.left));
  const h=Math.max(0,Math.min(bottom,other.bottom)-Math.max(top,other.top));
  return w*h;
 };
 const obstacles=cards.map(card=>({rect:card.getBoundingClientRect(),lead:card===lead}));
 const candidates=[
  {x:anchor.right+gap,y:anchor.top}, // Right of the card is the default.
  {x:anchor.left-width-gap,y:anchor.top},
  {x:anchor.left,y:anchor.bottom+gap},
  {x:anchor.left,y:anchor.top-height-gap}
 ];
 let best=null;
 for(const [rank,candidate] of candidates.entries()){
  const x=clamp(candidate.x,margin,viewportWidth-width-margin);
  const y=clamp(candidate.y,margin,viewportHeight-height-margin);
  // A non-overlapping position always wins; among those prefer the nearest
  // original candidate, with right/left ahead of above/below.
  const overlap=obstacles.reduce((total,item)=>
   total+intersection(x,y,x+width,y+height,item.rect)*(item.lead?100:15),0);
  const adjustment=Math.abs(x-candidate.x)+Math.abs(y-candidate.y);
  const score=overlap*100+adjustment+rank*2;
  if(!best||score<best.score)best={x,y,score};
 }
 panel.style.left=((best.x-boxRect.left)/scale)+'px';
 panel.style.top=((best.y-boxRect.top)/scale)+'px';
}

function placeNewField(){

 const rectangles=[...visible().map(n=>{const s=itemDims(n);return{x:n.x,y:n.y,w:s.w,h:s.h,weight:3}}),...fieldInView().map(f=>({x:f.x,y:f.y,w:f.width,h:f.height,weight:1}))];

  const [ox,oy]=proposals[i];const x=Math.round(cx+ox),y=Math.round(cy+oy);

}

let tipTimer=null,tipTarget=null;
const tooltipHost=document.createElement('div');tooltipHost.id='hover-help';tooltipHost.setAttribute('role','tooltip');tooltipHost.hidden=true;document.body.append(tooltipHost);
function hideTip(){clearTimeout(tipTimer);tipTimer=null;tipTarget=null;tooltipHost.hidden=true}
function tipCssToken(name,fallback){const value=parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));return Number.isFinite(value)?value:fallback}
function displayTip(el){
 if(!el||!el.isConnected||modalOpen)return;
 const msg=el.dataset.tip||el.getAttribute('title');if(!msg)return;
 const withinMenu=!!el.closest('#pa-context-menu');
 tooltipHost.textContent=msg;
 tooltipHost.classList.toggle('context-tip',withinMenu);
 tooltipHost.classList.toggle('ux014-heading-tip',el.classList.contains('rewrite-heading-tip'));
 tooltipHost.hidden=false;
 const r=el.getBoundingClientRect(),t=tooltipHost.getBoundingClientRect();
 const safe=tipCssToken('--pa-tooltip-screen-gap',8),gap=tipCssToken('--pa-tooltip-gap',9);
 let x,y;
 if(withinMenu){
  const m=plotContextMenu.getBoundingClientRect();
  x=m.left+tipCssToken('--pa-tooltip-left-inset',10);
  y=r.top-t.height-gap;
  if(y<safe){
   // Keep the tooltip off the menu when there is no space above the hovered item.
   if(m.bottom+gap+t.height<=innerHeight-safe)y=m.bottom+gap;
   else if(m.right+gap+t.width<=innerWidth-safe){x=m.right+gap;y=Math.min(Math.max(safe,r.top),innerHeight-safe-t.height)}
   else if(m.left-gap-t.width>=safe){x=m.left-gap-t.width;y=Math.min(Math.max(safe,r.top),innerHeight-safe-t.height)}
   else y=safe;
  }
 }else{
  x=r.left+r.width/2-t.width/2;
  y=r.top-t.height-gap;
  if(y<safe)y=r.bottom+gap;
 }
 x=Math.max(safe,Math.min(innerWidth-t.width-safe,x));
 y=Math.max(safe,Math.min(innerHeight-t.height-safe,y));
 tooltipHost.style.left=Math.round(x)+'px';tooltipHost.style.top=Math.round(y)+'px';
}

function validateImported(g){if(!g||!Array.isArray(g.nodes)||!Array.isArray(g.edges)||!Array.isArray(g.fields)||!Array.isArray(g.lanes))throw Error('В JSON должны быть nodes, edges, fields и lanes');
 const out=structuredClone(g),ids=new Set(),fids=new Set(out.fields.map(f=>f.id)),lids=new Set(out.lanes.map(l=>l.id));if(out.nodes.length>5000||out.edges.length>15000)throw Error('Слишком много элементов');
 for(const n of out.nodes){if(!n.id||ids.has(n.id)||!Number.isFinite(n.x)||!Number.isFinite(n.y))throw Error('Ошибка ID/координат ноды');ids.add(n.id);n.lineIds=n.lineIds||[];n.manualFieldIds=n.manualFieldIds||[];n.manualTags=n.manualTags||[];n.parent=n.parent??null;n.size=n.size||'normal';n.description=n.description||'';if(n.width!==undefined&&(!Number.isFinite(n.width)||n.width<180||n.width>780))throw Error('Некорректная ширина карточки');if(n.height!==undefined&&(!Number.isFinite(n.height)||n.height<95||n.height>640))throw Error('Некорректная высота карточки');if(n.color!==undefined&&!COLORS.includes(n.color))throw Error('Некорректный цвет карточки');if(n.lineIds.some(id=>!lids.has(id))||n.manualFieldIds.some(id=>!fids.has(id)))throw Error('Неизвестное поле или линия')}

 for(const f of out.fields){if(!f.id||!Number.isFinite(f.x)||!Number.isFinite(f.y)||!Number.isFinite(f.width)||!Number.isFinite(f.height))throw Error('Неверные границы поля');f.comment=f.comment||'';f.parent=f.parent??null}

// A completed write may leave an obsolete pending marker after interruption.
// Compare the entire normalized graph; never ignore substantive local changes.
// The graph's own revision is not the authoritative SQLite row revision.
// autoFieldIds are recalculated from field geometry and are never an edit.
function cwConflictGraph(raw){
 const g=validateImported(raw);
 ensureEditorialState(g);
 delete g.revision;
 for(const node of g.nodes)delete node.autoFieldIds;
 return g;
}
function cwStableConflictValue(value){
 if(Array.isArray(value))return value.map(cwStableConflictValue);
 if(value&&typeof value==='object')
  return Object.fromEntries(Object.keys(value).sort().map(key=>[key,cwStableConflictValue(value[key])]));
 return value;
}
function cwConflictEqual(a,b){
 return JSON.stringify(cwStableConflictValue(a))===JSON.stringify(cwStableConflictValue(b));
}
// A non-null result proves that the ONLY substantive difference is the
// positions of existing notes. Empty array means identical editorial content.
// Never infer or merge changed text, membership, nodes, links or metadata.
function cwPendingNotePositions(localRaw,serverRaw){
 const local=cwConflictGraph(localRaw),server=cwConflictGraph(serverRaw);
 if(local.gapNotes.length!==server.gapNotes.length)return null;
 const moves=[];
 for(let i=0;i<local.gapNotes.length;i++){
  const from=local.gapNotes[i],to=server.gapNotes[i];
  if(!from||!to||from.id!==to.id)return null;
  if(![from.x,from.y,to.x,to.y].every(Number.isFinite))return null;
  if(from.x!==to.x||from.y!==to.y){
   moves.push({noteId:from.id,x:from.x,y:from.y});
   to.x=from.x;to.y=from.y;
  }
 }
 return cwConflictEqual(local,server)?moves:null;
}
function cwEquivalentPersistedGraphs(local,server){

async function openProject(id){

  if(remote.dirty||remote.busy)await flushRemote();

 }
 creativeWorkspacePreview=null;cwClearDraftSelection();cwClearDraftMoves();
 cwStageReview=null;cwPreparedNoteAlternatives.clear();cwHandoffClear();
 cwPendingNoteReconcile=null;
 if(remote.connected){const rec=await apiRequest('/api/projects/'+encodeURIComponent(id));remote.revision=rec.revision;
 let pending=false;try{pending=localStorage.getItem(PENDING_PREFIX+id)==='1'}catch{}
 const backup=pending?localStorage.getItem(KEY_PREFIX+id):null;
 const serverGraph=validateImported(rec.graph);
 if(pending&&backup){
  const localGraph=validateImported(JSON.parse(backup));
  const positionChanges=cwPendingNotePositions(localGraph,serverGraph);
  if(positionChanges?.length===0){
   // Only obsolete derived fields or revisions differ: no content to recover.
   try{localStorage.removeItem(PENDING_PREFIX+id)}catch{}
   state=serverGraph;remote.blocked=false;remote.dirty=false;
  }else{
